[project]
name = "helia-rt"
version = "0.2.2"
description = "Development tooling for the heliaRT microcontroller runtime."
authors = [
    {name = "Ambiq AI", email = "support.aitg@ambiq.com"},
]
readme = "README.md"

requires-python = ">=3.11,<3.13"

dependencies = ["ruff>=0.7.2"]


[dependency-groups]
dev = [
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
