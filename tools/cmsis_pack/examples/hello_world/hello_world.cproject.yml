project:
  groups:
    - group: App
      files:
        - file: main.cc

  components:
    - component: ARM::CMSIS:CORE
    - component: ARM::Device:Startup&C Startup
    - component: Ambiq::Machine Learning:TFLM Runtime:helia-rt&Reference

  misc:
