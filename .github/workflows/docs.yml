name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Validate the docs build on pull requests too. Without this the --strict
  # build only ran after merge, so a broken or unreachable page failed the
  # Pages deploy on main instead of the PR that introduced it.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Scope concurrency per ref so pull-request validation runs do not queue
# behind (or against) the single shared Pages deploy lane on main.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Pull-request validation. Deliberately does not touch the Pages API or
  # upload an artifact, so it needs no pages permissions and works for
  # fork pull requests.
  validate:
    name: Validate docs build (strict)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # This job builds pull-request-controlled code (mkdocs config can execute
    # arbitrary Python), so do not inherit the workflow-level pages/id-token
    # write grants — it only needs to read the repository.
    permissions:
      contents: read

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
            enable-cache: true
      - name: Build docs 🔧
        env:
          CI: ""
        run: |
          uv sync --locked
          uv run mkdocs build --strict

  # Build job
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
            enable-cache: true
      - name: Install and Build 🔧
        env:
          CI: ""
          PUBLIC_URL: "${{ steps.pages.outputs.base_url }}/"
        run: |
          uv sync
          # --strict turns the validation warnings configured in mkdocs.yaml
          # (pages missing from nav, broken internal links) into build
          # failures, so documentation cannot land unreachable or broken.
          uv run mkdocs build --strict
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v5
