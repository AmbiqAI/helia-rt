name: heliaRT Build

on:

  workflow_call:
    inputs:
      trigger-sha:
        required: true
        type: string
    secrets:
      ARM_UBL_LICENSE_IDENTIFIER:
        required: false

  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA). Leave empty to use the current commit."
        required: false
        default: ""

permissions:
  contents: read

# The CI image is resolved by the `ci-image` setup job below and consumed via
# `needs.ci-image.outputs.image`. `container.image` does not support the `env`
# context, so a tiny setup job is the cleanest way to keep a single pin point.
#
# The image is pinned by DIGEST, not by tag. `:latest` is rebuilt by manual
# dispatch of helia_build_docker_image.yml and is not a `needs:` of this
# workflow, so a tag lets the image drift from the repo's Dockerfile with no
# commit recording the change -- and no run recording which image it used.
#
# Five workflows pin this image and they must all carry the SAME digest, or
# the test matrix and the release build silently run on different images. See
# .github/workflows/README.md for the pin-point list and the re-pin recipe.

jobs:
  ci-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - id: image
        run: echo "image=ghcr.io/ambiqai/helia-rt-ci@sha256:55372f29023cd1be1887af5761c8e6c18765b4e68ac28e02510d519e461692c9" >> "$GITHUB_OUTPUT"  # ghcr.io/ambiqai/helia-rt-ci:latest as of 2026-08-25

  helia_build:
    name: build-${{ matrix.arch }}-${{ matrix.toolchain }}
    needs: ci-image
    runs-on: ubuntu-latest-md
    container:
      image: ${{ needs.ci-image.outputs.image }}

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        arch: [ "cortex-m55", "cortex-m4+fp", "cortex-m0" ]
        toolchain: [ "gcc", "atfe" ]
        exclude:
          # ATfE doesn't ship a v6-M (cortex-m0) target out of the box.
          - arch: "cortex-m0"
            toolchain: "atfe"

    env:
      ARM_UBL_LICENSE_IDENTIFIER: ${{ secrets.ARM_UBL_LICENSE_IDENTIFIER }}

    steps:
      - name: Select ref
        id: sel
        shell: bash
        run: |
          if [[ -n "${{ inputs.trigger-sha }}" ]]; then
            echo "ref=${{ inputs.trigger-sha }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.ref }}" ]]; then
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            # default to the current commit of this workflow run
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.sel.outputs.ref }}

      - name: Mark workspace as safe for Git
        run: git config --global --add safe.directory "*"

      - name: Cache third-party downloads
        uses: actions/cache@v6
        with:
          path: tensorflow/lite/micro/tools/make/downloads
          key: ${{ runner.os }}-third-party-downloads-${{ hashFiles('tensorflow/lite/micro/tools/make/Makefile','tensorflow/lite/micro/tools/make/third_party_downloads.inc','tensorflow/lite/micro/tools/make/*_download.sh','tensorflow/lite/micro/tools/make/ext_libs/*_download.sh','tensorflow/lite/micro/tools/make/ext_libs/helia.inc') }}

      - name: Build (${{ matrix.arch }} / ${{ matrix.toolchain }})
        run: |
          chmod +x tensorflow/lite/micro/tools/ci_build/test_helia.sh
          tensorflow/lite/micro/tools/ci_build/test_helia.sh \
            -a "${{ matrix.arch }}" \
            -t "${{ matrix.toolchain }}" \
            --no-tests
