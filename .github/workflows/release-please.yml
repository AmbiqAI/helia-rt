name: release-please

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Scopes the automatic GITHUB_TOKEN, which is now used only by the called
# helia_release.yml (`contents: write`, to attach the bundle to the release).
# release-please itself authenticates with the App token minted below, whose
# permissions are requested at mint time and are independent of this block.
permissions:
  contents: write
  pull-requests: write

# release-please force-pushes the release branch on every run, and each of those
# pushes now starts a full CI pass on the release PR (it edits nsx/** and
# tensorflow/lite/micro/**, which smoke_cmake.yml is path-filtered on). Two
# pushes to `main` landing close together already raced once, on 2026-08-19,
# with both runs force-pushing the branch. That was free when the release PR ran
# no CI; it is not free now.
#
# Serialise rather than cancel: code-suggester re-parents the release branch
# onto `main`'s current HEAD on every run, so cancelling a run mid-flight can
# leave the branch computed from an older `main`.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Only the canonical repo has the App installed, so on a fork every push to
    # `main` would otherwise hard-fail on the credential preflight below. Same
    # guard style as cortex_m.yml / run_ci.yml.
    if: github.repository == 'AmbiqAI/helia-rt'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Why not secrets.GITHUB_TOKEN?
      #
      # Events raised by the default GITHUB_TOKEN do not start workflow runs the
      # way a human's do, and the two triggers this repo depends on fail in
      # *different* ways:
      #
      #   - `pull_request_target` — never raised at all. This is the one that
      #     matters: tests_entry.yml produces the ten required
      #     `helia-test / test-*` contexts, and they simply never appear.
      #   - `pull_request` — IS raised, but the run is created in an
      #     approval-required state (`conclusion: action_required`) and
      #     publishes no check runs until a maintainer clicks "Approve workflows
      #     to run". Verifiable on #177 today: two such runs exist on its head
      #     commit, while its check-run count is still zero.
      #
      # So the release PR can never satisfy the 11 required contexts on its own:
      # ten never appear, and `Validate docs build (strict)` would need a manual
      # click after every single push. It is structurally unmergeable.
      #
      # A GitHub App installation token is a separate actor, exempt from both
      # behaviours, so the release PR is checked like any human PR and passes
      # through the same gate, unweakened.
      #
      # Setup (one-time, org admin): docs/contributing/release-process.md
      # -> "Release automation credentials".
      - name: Check release automation credentials
        env:
          APP_CLIENT_ID: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${APP_CLIENT_ID:-}" ] || missing="${missing} RELEASE_PLEASE_APP_CLIENT_ID"
          [ -n "${APP_PRIVATE_KEY:-}" ] || missing="${missing} RELEASE_PLEASE_APP_PRIVATE_KEY"
          if [ -n "${missing}" ]; then
            echo "::error ::Release automation is not configured. Missing repository secret(s):${missing}. See docs/contributing/release-process.md -> 'Release automation credentials'. Until these exist no release PR can be opened or updated."
            exit 1
          fi

      # Mints a short-lived (1 h) installation token scoped to this repository
      # only. The requested permissions are narrowed here to exactly what
      # release-please uses, so an over-granted App installation cannot leak
      # extra authority into this job.
      - name: Mint release-please token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Release Please (manifest)
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  helia-release:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    uses: ./.github/workflows/helia_release.yml
    with:
      ref: ${{ needs.release.outputs.tag_name }}
      tag: ${{ needs.release.outputs.tag_name }}
      upload_to_release: true
    secrets: inherit
