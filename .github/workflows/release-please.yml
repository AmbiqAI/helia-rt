name: release-please

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# release-please writes the release branch, the tag and the GitHub Release
# (contents), and opens and updates the release PR (pull-requests). The called
# helia_release.yml reuses `contents: write` to attach the bundle to the release.
permissions:
  contents: write
  pull-requests: write

# release-please force-pushes the release branch whenever the generated PR body
# changes, and two runs doing that at once is a real race: code-suggester
# re-parents the branch onto `main`'s current HEAD on every run, so the loser can
# leave the branch computed from an older `main`. It has already happened -- on
# 2026-08-19 the runs for two `main` pushes overlapped (22:08:15-22:08:44 and
# 22:08:31-22:09:05) and both force-pushed, at 22:08:42 and 22:09:02.
#
# Serialise rather than cancel, for the same reason: cancelling a run mid-flight
# can leave the branch half-computed.
#
# One repository-wide lane, not one per ref. `target-branch` is unset, so
# release-please resolves the repository's default branch itself and force-pushes
# the same release branch no matter which ref the run started from. Keying on
# `github.ref` would put a `workflow_dispatch` from any other ref in its own
# lane, free to race the very `main` pushes this block exists to serialise.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    # A fork has no business opening release PRs against its upstream, and this
    # job writes tags and Releases. Same guard style as cortex_m.yml / run_ci.yml.
    if: github.repository == 'AmbiqAI/helia-rt'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # GITHUB_TOKEN preserves the maintainer approval gate for release PR checks.
      # see AmbiqAI/helia-rt#199
      - name: Release Please (manifest)
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  helia-release:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    uses: ./.github/workflows/helia_release.yml
    with:
      ref: ${{ needs.release.outputs.tag_name }}
      tag: ${{ needs.release.outputs.tag_name }}
      upload_to_release: true
    secrets: inherit

  docs-release:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      source_ref: ${{ needs.release.outputs.tag_name }}
      release_publish: true
