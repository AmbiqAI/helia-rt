name: heliaRT Assets (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, commit, or tag) to build"
        required: true
        default: main
      tag:
        description: "Asset tag name (defaults to ref)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  helia-assets:
    # helia_release.yml declares contents: write at its top level, and a called
    # workflow cannot exceed its caller's token, so the call must grant it even
    # with upload_to_release false.
    permissions:
      contents: write
    uses: ./.github/workflows/helia_release.yml
    with:
      ref: ${{ inputs.ref }}
      tag: ${{ inputs.tag }}
      upload_to_release: false
    secrets:
      ARM_UBL_LICENSE_IDENTIFIER: ${{ secrets.ARM_UBL_LICENSE_IDENTIFIER }}
