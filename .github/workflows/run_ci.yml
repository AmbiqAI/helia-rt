name: Run-CI

# This is the entry point for ci.yml for scheduled and workflow_dispatch events.

on:
  # schedule:
  #   # 10am UTC is 3am or 4am PT depending on daylight savings.
  #   - cron: '0 10 * * *'

  # Allow manually triggering of the workflow.
  workflow_dispatch: {}

jobs:
  call-ci:
    uses: ./.github/workflows/ci.yml
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.repository == 'AmbiqAI/helia-rt')
    with:
      trigger-sha: ${{ github.sha }}

  issue-on-error:
    needs: [call-ci]
    # ci/issue_on_error.py checks out the repository and runs `gh issue` and
    # `gh label` against it, hence `contents: read` and `issues: write`.
    permissions:
      contents: read
      issues: write
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    uses: ./.github/workflows/issue_on_error.yml
    with:
      repo: ${{ github.repository }}
      workflow: ${{ github.workflow }}
      run_id: ${{ github.run_id }}
      run_number: ${{ github.run_number }}
      flag_label: ci:bot_issue
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
