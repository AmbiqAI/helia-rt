name: cmake-ssot-smoke

# Smoke gates for the CMake source-of-truth (issue #147).
# Validates that:
#   1. cmake/helia_rt_sources.cmake loads in script mode for every backend.
#   2. dump_manifest emits valid JSON with the expected schema.
#   3. The top-level CMakeLists configures + builds helia_rt::reference on host clang.
#   4. The upstream-sync invariant holds (no SSoT-time edits under tensorflow/, signal/,
#      python/tflite_micro/).
#   5. (Phase 2) nsx::helia_rt cross-compiles for Cortex-M55 against ns-cmsis-nn.
#   6. (Phase 4) zephyr/CMakeLists.txt builds helia_rt against the SSoT for qemu_cortex_m3.

on:
  pull_request:
    paths:
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'nsx/**'
      - 'tensorflow/lite/micro/**'
      - 'signal/**'
      - 'tools/cmsis_pack/**'
      - 'zephyr/**'
      - '.github/zephyr-smoke/**'
      - '.github/workflows/smoke_cmake.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifest:
    name: dump_manifest (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [reference, cmsis_nn, helia]
    steps:
      - uses: actions/checkout@v7
      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake
      - name: Dump + validate JSON manifest
        run: |
          set -euo pipefail
          cmake -DBACKEND=${{ matrix.backend }} -P cmake/dump_manifest.cmake \
              > manifest.json
          python3 -c "
          import json, sys
          d = json.load(open('manifest.json'))
          assert d['schema'] == 'helia-rt-manifest-v1', d['schema']
          assert d['backend'] == '${{ matrix.backend }}', d['backend']
          assert len(d['include_dirs'])  >= 4
          assert len(d['common_sources']) >= 30
          assert len(d['kernel_sources']) >= 100
          # Path well-formedness: nothing absolute, no '..'.
          for s in d['common_sources'] + d['kernel_sources']:
              assert not s.startswith('/'),  s
              assert '..' not in s.split('/'), s
          # Backend define contract. The helia backend additionally
          # carries per-kernel optimization defines defaulted to SPEED
          # (see HELIA_RT_GLOBAL_KERNEL_OPTIMIZE / _CONV_OPT / _FC_OPT in
          # cmake/helia_rt_sources.cmake).
          want = {
              'reference': [],
              'cmsis_nn':  ['CMSIS_NN'],
              'helia':     ['CMSIS_NN', 'HELIA', 'ARM_NN_ENABLE_F32=1',
                            'CONV_KERNEL_OPTIMIZED_FOR_SPEED',
                            'FC_KERNEL_OPTIMIZED_FOR_SPEED',
                            'KERNELS_OPTIMIZED_FOR_SPEED'],
          }['${{ matrix.backend }}']
          assert d['backend_defines'] == want, (d['backend_defines'], want)
          print(f\"OK: backend={d['backend']} kernels={len(d['kernel_sources'])} \"
                f\"common={len(d['common_sources'])} defs={d['backend_defines']}\")
          "

  host-build:
    name: Configure + build helia_rt::reference (host clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DHELIA_RT_BUILD_TYPE=release_with_logs \
              -DHELIA_RT_DISABLE_X86_NEON=ON
      - name: Build
        run: cmake --build build --target helia_rt_reference -j
      - name: Sanity check archive
        run: |
          test -f build/libhelia_rt_reference.a
          ls -lh build/libhelia_rt_reference.a

  invariant:
    name: Upstream-sync invariant (no SSoT edits under tensorflow/, signal/)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check diff scope
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          range="$base...$head"
          # SSoT branches (those that touch cmake/ or root CMakeLists.txt) MUST NOT
          # also touch upstream-managed paths. PRs that legitimately need to do so
          # should be split.
          # Use the PR merge-base diff so branches cut from older tags do not
          # inherit unrelated main-branch churn into this invariant check.
          if git diff --name-only "$range" -- cmake/ CMakeLists.txt \
                | grep -q .; then
              echo "PR touches SSoT files — verifying upstream paths are untouched..."
              # Allow the small set of upstream-owned paths that currently need
              # heliaRT-local divergence for generic CMake integration. Keep
              # this list narrow so the invariant still catches accidental drift.
              #
              # HELIA backend implementations (kernels/helia/), the shared
              # kernel tests that carry HELIA float16 coverage (*_test.cc
              # only — never the shared kernel sources or *_common.cc, which
              # must stay byte-identical to upstream), and HELIA's Make/CI
              # adapters evolve together with the backend definitions in the
              # SSoT.
              bad=$(git diff --name-only "$range" -- \
                      tensorflow/ signal/ python/tflite_micro/ \
                      tensorflow/lite/micro/tools/make/ \
                    | grep -Ev '^tensorflow/lite/micro/(helia_rt_version|heliart_version)\.h$' \
                    | grep -Ev '^tensorflow/lite/micro/tools/ci_build/(package_helia_bundle|release_asset_helpers)\.sh$' \
                    | grep -Ev '^tensorflow/lite/micro/tools/ci_build/(build|test)_helia\.sh$' \
                    | grep -Ev '^tensorflow/lite/micro/tools/make/ext_libs/(helia\.inc|ns_cmsis_nn_download\.sh)$' \
                    | grep -Ev '^tensorflow/lite/micro/tools/make/ext_libs/(cmsis|cmsis_nn|xtensa)_download\.sh$' \
                    | grep -Ev '^tensorflow/lite/micro/kernels/helia/' \
                    | grep -Ev '^tensorflow/lite/micro/kernels/(activations|add|batch_matmul|concatenation|conv|depthwise_conv|fully_connected|logistic|maximum_minimum|mul|pad|pooling|reshape|softmax|svdf|tanh|transpose|transpose_conv|unidirectional_sequence_lstm)_test\.cc$' \
                    | grep -Ev '^tensorflow/lite/micro/kernels/ethos_u/ethosu\.cc$' \
                    | grep -Ev '^tensorflow/lite/micro/micro_mutable_op_resolver\.h$' \
                    || true)
              if [ -n "$bad" ]; then
                  echo "::error::SSoT PR also edits upstream-managed paths:"
                  echo "$bad"
                  exit 1
              fi
              echo "OK: SSoT-only change, upstream paths untouched."
          else
              echo "Not an SSoT change; invariant trivially holds."
          fi

  cmsis-pack-build:
    name: Build CMSIS-Pack from SSoT manifest
    runs-on: ubuntu-latest
    env:
      CMSIS_TOOLBOX_VERSION: 2.13.0
    steps:
      - uses: actions/checkout@v7
      - name: Install cmake + CMSIS-Toolbox
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake curl ca-certificates
          curl -fsSL \
              "https://github.com/Open-CMSIS-Pack/cmsis-toolbox/releases/download/${CMSIS_TOOLBOX_VERSION}/cmsis-toolbox-linux-amd64.tar.gz" \
              -o /tmp/cmsis-toolbox.tar.gz
          sudo tar -C /opt -xzf /tmp/cmsis-toolbox.tar.gz
          echo "/opt/cmsis-toolbox-linux-amd64/bin" >> "${GITHUB_PATH}"
          /opt/cmsis-toolbox-linux-amd64/bin/packchk --version
      - name: Build pack
        run: |
          set -euo pipefail
          python3 tools/cmsis_pack/build_pack.py --output dist --keep-stage
          ls -lh dist/
      - name: Validate pack with packchk
        run: |
          set -euo pipefail
          PACK=$(ls dist/Ambiq.helia-rt.*.pack | head -1)
          STAGE="${PACK%.pack}.stage"
          packchk --disable-validation "${STAGE}/Ambiq.helia-rt.pdsc"
      - name: Validate pack archive + pdsc
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, zipfile, sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          packs = list(Path('dist').glob('Ambiq.helia-rt.*.pack'))
          assert len(packs) == 1, packs
          pack = packs[0]
          assert pack.stat().st_size > 100_000, f'pack too small: {pack.stat().st_size}'
          assert pack.stat().st_size < 50 * 1024 * 1024, (
              f'pack too large ({pack.stat().st_size} bytes); deny-list regression?'
          )

          with zipfile.ZipFile(pack) as zf:
              names = set(zf.namelist())
              pdsc_name = next(n for n in names if n.endswith('.pdsc'))
              root = ET.fromstring(zf.read(pdsc_name))
              assert root.tag == 'package', root.tag

              variants = {c.get('Cvariant') for c in root.findall('components/component')}
              assert variants == {'Reference', 'CMSIS-NN', 'HELIA'}, variants

              # Every <file category="source"> must resolve in the archive.
              missing = []
              for f in root.findall('components/component/files/file'):
                  if f.get('category') in ('source', 'preIncludeGlobal'):
                      if f.get('name') not in names:
                          missing.append(f.get('name'))
              assert not missing, f'missing in archive: {missing[:5]}'
          print(f'OK: pack={pack.name} size={pack.stat().st_size:,} variants={sorted(variants)}')
          PY
      - name: Validate pdsc contract (identity + ns-cmsis-nn pin)
        run: |
          set -euo pipefail
          PACK=$(ls dist/Ambiq.helia-rt.*.pack | head -1)
          python3 tools/cmsis_pack/check_pdsc.py "${PACK}"
      - name: Upload pack artifact
        uses: actions/upload-artifact@v7
        with:
          name: helia-rt-cmsis-pack
          path: dist/Ambiq.helia-rt.*.pack
          if-no-files-found: error

  nsx-cross-build:
    name: nsx::helia_rt cross-compile (Cortex-M55, gcc)
    runs-on: ubuntu-latest
    # ns-cmsis-nn is public and clones with no credential, so this job no
    # longer needs a repo secret and runs for fork and Dependabot PRs too.
    # (It previously skipped for those, silently dropping the only Cortex-M55
    # cross-compile coverage from exactly the PRs that change CI actions.)
    env:
      # Pin CI to the tested ns-cmsis-nn release. This may be newer than the
      # minimum compatible version declared by the CMSIS-Pack metadata.
      NS_CMSIS_NN_REF: v7.29.2
    steps:
      - name: Checkout helia-rt
        uses: actions/checkout@v7
        with:
          path: helia-rt
      - name: Checkout ns-cmsis-nn (pinned ref)
        run: |
          set -euo pipefail
          # AmbiqAI/ns-cmsis-nn is public: clone anonymously. Keeping a token
          # out of the URL also keeps it out of git's "unable to access '<url>'"
          # error output when the network misbehaves.
          git clone --depth 1 --branch "${NS_CMSIS_NN_REF}" \
              "https://github.com/AmbiqAI/ns-cmsis-nn.git" \
              ns-cmsis-nn
          (cd ns-cmsis-nn && git rev-parse HEAD)
      - name: Install cross toolchain + ninja
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              cmake ninja-build gcc-arm-none-eabi \
              libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          arm-none-eabi-gcc --version | head -1
          # Confirm libc headers (string.h etc.) and libgcc are reachable.
          arm-none-eabi-gcc -print-sysroot
          arm-none-eabi-gcc -E -x c -include string.h /dev/null > /dev/null
          echo "OK: libc headers reachable"
      - name: Write smoke harness
        run: |
          mkdir -p smoke
          cat > smoke/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.21)
          project(nsx_helia_rt_smoke C CXX ASM)

          # Stub of the NSX board flags interface that real boards ship.
          add_library(nsx_board_flags INTERFACE)
          target_compile_options(nsx_board_flags INTERFACE
              -mcpu=cortex-m55 -mthumb -mfloat-abi=hard -mfpu=fpv5-d16
              -ffunction-sections -fdata-sections
              -Wno-unused-parameter)
          target_compile_definitions(nsx_board_flags INTERFACE
              ARM_MATH_LOOPUNROLL ARM_MATH_DSP)
          set(NSX_BOARD_FLAGS_TARGET nsx_board_flags)
          set(NSX_SOC_FAMILY apollo510)

          # Stub SoC HAL — the real module ships from nsx-soc-hal.
          add_library(nsx_soc_hal INTERFACE)

          # ns-cmsis-nn selects its fp32/fp16 sources — and decides whether to
          # export ARM_NN_ENABLE_F32/F16 — while its own CMakeLists is
          # processed. These options MUST therefore be set by the parent build
          # BEFORE add_subdirectory(<ns-cmsis-nn>/nsx). Setting them later
          # (e.g. from nsx-helia-rt) is a no-op. Requires ns-cmsis-nn v7.28.0+.
          set(NSX_CMSIS_NN_ENABLE_F32 ON CACHE BOOL "" FORCE)
          set(NSX_CMSIS_NN_ENABLE_F16 ON CACHE BOOL "" FORCE)

          add_subdirectory(${NS_CMSIS_NN_DIR}/nsx ns_cmsis_nn EXCLUDE_FROM_ALL)
          add_subdirectory(${HELIA_RT_DIR}/nsx   nsx_helia_rt   EXCLUDE_FROM_ALL)

          # Archive-only builds cannot detect a float kernel that was never
          # compiled into ns-cmsis-nn: the reference stays unresolved until
          # something actually links. This probe forces a real link of the
          # representative fp32/fp16 entry points plus the heliaRT kernels
          # that call them.
          if(NSX_HELIA_RT_BACKEND STREQUAL "helia")
              add_executable(nsx_helia_rt_link_probe
                  ${CMAKE_CURRENT_SOURCE_DIR}/link_probe.cc)
              target_link_libraries(nsx_helia_rt_link_probe
                  PRIVATE nsx::helia_rt nsx_board_flags)
              target_link_options(nsx_helia_rt_link_probe PRIVATE
                  --specs=nosys.specs)
              set_target_properties(nsx_helia_rt_link_probe PROPERTIES
                  SUFFIX .elf)
          endif()
          EOF
          cat > smoke/link_probe.cc <<'EOF'
          // Forces the linker to resolve the optimized float kernels that the
          // helia backend dispatches to. If ns-cmsis-nn was built without
          // fp32/fp16 source selection, this fails to link — which is exactly
          // what the archive-only smoke build cannot catch.
          #include <stdint.h>

          #include "arm_nnfunctions.h"

          #include "tensorflow/lite/micro/kernels/micro_ops.h"

          #ifndef ARM_NN_ENABLE_F32
          #error "helia backend must export ARM_NN_ENABLE_F32"
          #endif
          #ifndef ARM_NN_ENABLE_F16
          #error "helia backend must export ARM_NN_ENABLE_F16"
          #endif

          namespace {
          // Kernels reached through helia_rt::helia's float dispatch paths.
          void* const kFloatKernels[] = {
              reinterpret_cast<void*>(&arm_convolve_wrapper_f32),
              reinterpret_cast<void*>(&arm_depthwise_conv_wrapper_f32),
              reinterpret_cast<void*>(&arm_avg_pool_f32),
              reinterpret_cast<void*>(&arm_max_pool_f32),
              reinterpret_cast<void*>(&arm_softmax_f32),
              reinterpret_cast<void*>(&arm_convolve_wrapper_f16),
              reinterpret_cast<void*>(&arm_depthwise_conv_wrapper_f16),
              reinterpret_cast<void*>(&arm_avg_pool_f16),
              reinterpret_cast<void*>(&arm_max_pool_f16),
              reinterpret_cast<void*>(&arm_softmax_f16),
          };

          // heliaRT kernels that dispatch to them; pulls the archive members in.
          void* const kHeliaKernels[] = {
              reinterpret_cast<void*>(&tflite::Register_CONV_2D),
              reinterpret_cast<void*>(&tflite::Register_DEPTHWISE_CONV_2D),
              reinterpret_cast<void*>(&tflite::Register_AVERAGE_POOL_2D),
              reinterpret_cast<void*>(&tflite::Register_MAX_POOL_2D),
              reinterpret_cast<void*>(&tflite::Register_SOFTMAX),
          };
          }  // namespace

          extern "C" int main(void) {
            uintptr_t acc = 0;
            for (auto* p : kFloatKernels) acc ^= reinterpret_cast<uintptr_t>(p);
            for (auto* p : kHeliaKernels) acc ^= reinterpret_cast<uintptr_t>(p);
            return static_cast<int>(acc & 1u);
          }
          EOF
          cat > smoke/toolchain.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Generic)
          set(CMAKE_SYSTEM_PROCESSOR cortex-m55)
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          set(CMAKE_C_COMPILER   arm-none-eabi-gcc)
          set(CMAKE_CXX_COMPILER arm-none-eabi-g++)
          set(CMAKE_ASM_COMPILER arm-none-eabi-gcc)
          set(CMAKE_C_FLAGS_INIT
              "-mcpu=cortex-m55 -mthumb -mfloat-abi=hard -mfpu=fpv5-d16")
          set(CMAKE_CXX_FLAGS_INIT
              "-mcpu=cortex-m55 -mthumb -mfloat-abi=hard -mfpu=fpv5-d16 \
               -fno-exceptions -fno-rtti")
          EOF
      - name: Configure (Cortex-M55, gcc, release-with-logs)
        run: |
          cmake -S smoke -B smoke/build -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$(pwd)/smoke/toolchain.cmake" \
              -DHELIA_RT_DIR="$(pwd)/helia-rt" \
              -DNS_CMSIS_NN_DIR="$(pwd)/ns-cmsis-nn" \
              -DHELIA_RT_VARIANT=release-with-logs
      - name: Build helia_rt::helia + nsx_helia_rt_glue + nsx::cmsis_nn
        run: |
          cmake --build smoke/build \
              --target helia_rt_helia helia_rt_reference nsx_helia_rt_glue nsx_cmsis_nn \
              -j
      - name: Link float-kernel probe (fp32 + fp16 must resolve)
        run: |
          set -euo pipefail
          # Archives alone never resolve references, so a missing fp32/fp16
          # source selection in ns-cmsis-nn would go unnoticed. Force a link.
          cmake --build smoke/build --target nsx_helia_rt_link_probe -j
          PROBE=$(find smoke/build -name 'nsx_helia_rt_link_probe.elf' | head -1)
          test -n "${PROBE}"
          file "${PROBE}"
          # Assert the optimized float kernels are really in the image.
          # Capture the symbol table once instead of piping nm into grep per
          # symbol: `grep -q` exits at the first match, the still-writing nm
          # takes SIGPIPE, and `set -o pipefail` turns that 141 into a failure
          # that `!` inverts into a spurious "symbol missing" error.
          probe_syms=$(arm-none-eabi-nm -C "${PROBE}")
          for sym in arm_convolve_wrapper_f32 arm_avg_pool_f32 arm_softmax_f32 \
                     arm_convolve_wrapper_f16 arm_avg_pool_f16 arm_softmax_f16; do
            if ! grep -qE " (T|t|W|w) ${sym}$" <<<"${probe_syms}"; then
              echo "::error::${sym} missing from link probe image"
              exit 1
            fi
          done
          echo "OK: fp32 + fp16 kernels resolved at link time"
      - name: Sanity check archives
        run: |
          set -euo pipefail
          find smoke/build -name 'lib*.a' | sort
          ARCHIVE=smoke/build/nsx_helia_rt/helia-rt-src/libhelia_rt_helia.a
          test -f "${ARCHIVE}"
          test -f smoke/build/ns_cmsis_nn/libnsx_cmsis_nn.a
          # Confirm objects are Cortex-M (Thumb) ELF. `head` exits after N
          # lines, so piping a long-running producer into it makes the producer
          # take SIGPIPE and `set -o pipefail` fail this step -- inside the very
          # step that asserts on Ethos-U, where it would read as a regression.
          # Capture first, then trim.
          file_out=$(file "${ARCHIVE}")
          head -1 <<<"${file_out}"
          objdump_out=$(arm-none-eabi-objdump -a "${ARCHIVE}")
          head -5 <<<"${objdump_out}"
          # This build dir is the default (Ethos-U OFF). Assert the archive
          # carries NO core-driver reference: every consumer that does not opt
          # in relies on not inheriting an unresolved ethosu_* symbol at link.
          #
          # Capture nm's output before grepping it. In the `if nm | grep` shape
          # an nm failure (archive gone, nm missing) leaves grep nothing to
          # match, grep exits 1, the `if` is false and the step prints OK -- a
          # spurious PASS that hides a broken assert. As a variable, any nm
          # error trips `set -e` and fails the step loudly.
          syms=$(arm-none-eabi-nm "${ARCHIVE}")
          if grep -q " U ethosu_reserve_driver" <<<"${syms}"; then
            echo "::error::ethosu_reserve_driver referenced in a default (Ethos-U OFF) build"
            exit 1
          fi
          echo "OK: default build carries no Ethos-U core-driver reference"

      # Cover the reference backend in a separate build dir. The cmsis_nn
      # backend requires upstream CMSIS-NN headers (ns-cmsis-nn has modified
      # API signatures) and is tested via the dump_manifest + Zephyr jobs
      # which use the correct upstream provider.
      - name: Configure + build (reference backend)
        run: |
          cmake -S smoke -B smoke/build-reference -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$(pwd)/smoke/toolchain.cmake" \
              -DHELIA_RT_DIR="$(pwd)/helia-rt" \
              -DNS_CMSIS_NN_DIR="$(pwd)/ns-cmsis-nn" \
              -DNSX_HELIA_RT_BACKEND=reference \
              -DHELIA_RT_VARIANT=release-with-logs
          cmake --build smoke/build-reference \
              --target helia_rt_reference nsx_helia_rt_glue -j
          test -f smoke/build-reference/nsx_helia_rt/helia-rt-src/libhelia_rt_reference.a

      # Cover the Ethos-U opt-in path. The archive is expected to carry
      # unresolved core-driver references (a provider module supplies them at
      # final app link), so assert on the undefined symbol rather than on a
      # link. This is what catches a silently-disabled toggle: with the flag
      # OFF, Register_ETHOSU() returns nullptr and no such reference exists.
      - name: Configure + build (Ethos-U enabled)
        run: |
          set -euo pipefail
          cmake -S smoke -B smoke/build-ethosu -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$(pwd)/smoke/toolchain.cmake" \
              -DHELIA_RT_DIR="$(pwd)/helia-rt" \
              -DNS_CMSIS_NN_DIR="$(pwd)/ns-cmsis-nn" \
              -DNSX_HELIA_RT_ENABLE_ETHOSU=ON \
              -DHELIA_RT_VARIANT=release-with-logs
          cmake --build smoke/build-ethosu --target helia_rt_helia -j
          ARCHIVE=smoke/build-ethosu/nsx_helia_rt/helia-rt-src/libhelia_rt_helia.a
          test -f "${ARCHIVE}"
          # The Ethos-U kernel externs the core-driver entry points, so an
          # enabled build must leave them undefined in the archive.
          #
          # Capture nm's output instead of piping it into grep. The two pipe
          # shapes fail in opposite directions, and neither is safe:
          #   `if ! nm | grep -q`  -- grep exits at the first match, nm takes
          #        SIGPIPE, `set -o pipefail` reports 141, `!` inverts it into
          #        a spurious FAILURE.
          #   `if nm | grep`       -- an nm failure yields no output, grep
          #        exits 1, and the step reads that as "symbol absent, all
          #        good": a spurious PASS (this is the OFF assert's shape).
          # With the symbols in a variable, `set -e` fails on any nm error and
          # grep sees the whole table.
          syms=$(arm-none-eabi-nm "${ARCHIVE}")
          if ! grep -q " U ethosu_reserve_driver" <<<"${syms}"; then
            echo "::error::ethosu_reserve_driver not referenced; Ethos-U dispatch did not build in"
            exit 1
          fi
          echo "OK: Ethos-U dispatch compiled in (core-driver refs undefined as expected)"

      # Cover the ownership guard in nsx/CMakeLists.txt. Without these
      # steps, deleting the guard block outright leaves every check in this
      # job green.
      - name: Toggle the wrapper OFF in the existing Ethos-U build dir
        run: |
          set -euo pipefail
          # Reconfiguring a build dir whose HELIA_RT_ENABLE_ETHOSU entry we
          # FORCEd ON must be accepted: the guard has to recognize its own
          # previous write as ours rather than as a consumer override. This is
          # the provenance path, and a guard that latches or over-rejects fails
          # here.
          cmake -S smoke -B smoke/build-ethosu -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$(pwd)/smoke/toolchain.cmake" \
              -DHELIA_RT_DIR="$(pwd)/helia-rt" \
              -DNS_CMSIS_NN_DIR="$(pwd)/ns-cmsis-nn" \
              -DNSX_HELIA_RT_ENABLE_ETHOSU=OFF \
              -DHELIA_RT_VARIANT=release-with-logs
          # Configure alone does not re-archive; rebuild (incremental, cheap)
          # and assert the core-driver reference is gone again.
          cmake --build smoke/build-ethosu --target helia_rt_helia -j
          ARCHIVE=smoke/build-ethosu/nsx_helia_rt/helia-rt-src/libhelia_rt_helia.a
          test -f "${ARCHIVE}"
          syms=$(arm-none-eabi-nm "${ARCHIVE}")
          if grep -q " U ethosu_reserve_driver" <<<"${syms}"; then
            echo "::error::ethosu_reserve_driver still referenced after toggling the wrapper OFF"
            exit 1
          fi
          echo "OK: wrapper toggle accepted; Ethos-U dispatch dropped from the archive"

      - name: Reject a direct HELIA_RT_ENABLE_ETHOSU override (configure only)
        run: |
          set -euo pipefail
          # The repo-root toggle is owned by the nsx wrapper, which FORCEs it.
          # A consumer setting it directly must be told, not silently
          # overridden. Configure-only: this is expected to fail.
          set +e
          out=$(cmake -S smoke -B smoke/build-ethosu-reject -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$(pwd)/smoke/toolchain.cmake" \
              -DHELIA_RT_DIR="$(pwd)/helia-rt" \
              -DNS_CMSIS_NN_DIR="$(pwd)/ns-cmsis-nn" \
              -DHELIA_RT_ENABLE_ETHOSU=ON \
              -DHELIA_RT_VARIANT=release-with-logs 2>&1)
          rc=$?
          set -e
          echo "${out}"
          if [ "${rc}" -eq 0 ]; then
            echo "::error::configure succeeded; the HELIA_RT_ENABLE_ETHOSU ownership guard did not fire"
            exit 1
          fi
          # Match the guard's own wording so that some *other* configure
          # failure cannot pass for a rejection. CMake hard-wraps message()
          # text, so collapse newlines before matching.
          flat=$(tr '\n' ' ' <<<"${out}")
          if ! grep -q "owned by this module" <<<"${flat}"; then
            echo "::error::configure failed, but not with the ownership-guard message (rc=${rc})"
            exit 1
          fi
          echo "OK: direct HELIA_RT_ENABLE_ETHOSU override rejected by the guard"

      - name: Reject a reverse-polarity HELIA_RT_ENABLE_ETHOSU override (configure only)
        run: |
          set -euo pipefail
          # The guard has to reject disagreement in BOTH directions. The step
          # above only proves the ON-against-OFF direction, which a
          # truthiness-only check ("entry set but wrapper off") also passes —
          # while silently compiling Ethos-U in for a consumer who explicitly
          # passed -DHELIA_RT_ENABLE_ETHOSU=OFF. Configure-only: this is
          # expected to fail.
          set +e
          out=$(cmake -S smoke -B smoke/build-ethosu-reject-off -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$(pwd)/smoke/toolchain.cmake" \
              -DHELIA_RT_DIR="$(pwd)/helia-rt" \
              -DNS_CMSIS_NN_DIR="$(pwd)/ns-cmsis-nn" \
              -DNSX_HELIA_RT_ENABLE_ETHOSU=ON \
              -DHELIA_RT_ENABLE_ETHOSU=OFF \
              -DHELIA_RT_VARIANT=release-with-logs 2>&1)
          rc=$?
          set -e
          echo "${out}"
          if [ "${rc}" -eq 0 ]; then
            echo "::error::configure succeeded; an explicit -DHELIA_RT_ENABLE_ETHOSU=OFF was silently overridden"
            exit 1
          fi
          # CMake hard-wraps message() text, so collapse newlines before
          # matching (same reason as the step above).
          flat=$(tr '\n' ' ' <<<"${out}")
          if ! grep -q "owned by this module" <<<"${flat}"; then
            echo "::error::configure failed, but not with the ownership-guard message (rc=${rc})"
            exit 1
          fi
          # The remedy must echo the consumer's own intent (OFF), not invert it
          # into the wrapper's value.
          if ! grep -q "NSX_HELIA_RT_ENABLE_ETHOSU=OFF" <<<"${flat}"; then
            echo "::error::guard fired but did not name the wrapper option to set, or named the wrong value"
            exit 1
          fi
          echo "OK: explicit -DHELIA_RT_ENABLE_ETHOSU=OFF rejected instead of overridden"

      - name: Accept an agreeing HELIA_RT_ENABLE_ETHOSU value (configure only)
        run: |
          set -euo pipefail
          # The guard rejects *disagreement*, not the mere presence of the
          # repo-root entry: a consumer passing the old spelling with the value
          # the wrapper already dictates must still configure, and the value
          # must actually take effect. Without this step a guard that rejected
          # any -DHELIA_RT_ENABLE_ETHOSU at all — turning the silent override
          # into a hard stop for consumers who agree with us — would pass every
          # other check in this job.
          out=$(cmake -S smoke -B smoke/build-ethosu-agree -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$(pwd)/smoke/toolchain.cmake" \
              -DHELIA_RT_DIR="$(pwd)/helia-rt" \
              -DNS_CMSIS_NN_DIR="$(pwd)/ns-cmsis-nn" \
              -DNSX_HELIA_RT_ENABLE_ETHOSU=ON \
              -DHELIA_RT_ENABLE_ETHOSU=ON \
              -DHELIA_RT_VARIANT=release-with-logs 2>&1)
          echo "${out}"
          # The module's status line reports the toggle it resolved to; assert
          # on it so an accepted-but-dropped value cannot pass as success.
          if ! grep -q "ethos-u=ON" <<<"${out}"; then
            echo "::error::configure accepted the agreeing value but did not enable Ethos-U dispatch"
            exit 1
          fi
          echo "OK: agreeing HELIA_RT_ENABLE_ETHOSU accepted and applied"

  zephyr-build:
    name: Zephyr module build (qemu_cortex_m3, REFERENCE)
    runs-on: ubuntu-latest
    # Use the official Zephyr CI image: SDK, west, python, and arm-zephyr-eabi
    # toolchain are pre-installed at /opt/toolchains. The image does NOT ship
    # a checked-out zephyr tree, so we `west init` one ourselves below.
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.27.4
      options: --user root
    # The zephyrproject-rtos/ci image's default shell is /bin/sh (dash),
    # which does not support `set -o pipefail`. Force bash for every
    # `run:` step in this job.
    defaults:
      run:
        shell: bash
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
      ZEPHYR_REF: v4.0.0
    steps:
      - name: Checkout helia-rt
        uses: actions/checkout@v7
        with:
          path: helia-rt
      - name: Locate Zephyr SDK in CI image
        run: |
          set -euo pipefail
          # The ghcr.io/zephyrproject-rtos/ci image installs the SDK under
          # /opt/toolchains/zephyr-sdk-<ver>, but doesn't export
          # ZEPHYR_SDK_INSTALL_DIR for non-default shells, so CMake's
          # find_package(Zephyr-sdk) fails. Discover and export it.
          sdk_dir=$(find /opt -maxdepth 3 -type d -name 'zephyr-sdk-*' \
                      -not -name '*minimal*' | sort | tail -1)
          test -n "$sdk_dir" || (echo "::error::No zephyr-sdk found under /opt"; \
                                 ls /opt; exit 1)
          echo "Zephyr SDK: $sdk_dir"
          echo "ZEPHYR_SDK_INSTALL_DIR=$sdk_dir" >> "$GITHUB_ENV"
      - name: West init + update zephyr (shallow)
        run: |
          set -euo pipefail
          mkdir -p zephyrworkspace
          cd zephyrworkspace
          west init -m https://github.com/zephyrproject-rtos/zephyr \
              --mr "${ZEPHYR_REF}" .
          # --narrow keeps to manifest projects (no optional groups);
          # -o=--depth=1 makes each project a shallow clone. Keeps the
          # smoke under ~3 min instead of >10.
          west update --narrow -o=--depth=1
          west zephyr-export
          echo "ZEPHYR_BASE=$(pwd)/zephyr" >> "$GITHUB_ENV"
          (cd zephyr && git rev-parse --short HEAD)
      - name: Build smoke app for qemu_cortex_m3
        run: |
          set -euo pipefail
          # EXTRA_ZEPHYR_MODULES adds helia-rt to Zephyr's module list, which
          # picks up zephyr/module.yml + zephyr/CMakeLists.txt + zephyr/Kconfig.
          west build \
              -b qemu_cortex_m3 \
              -d build \
              -p always \
              helia-rt/.github/zephyr-smoke \
              -- \
              -DEXTRA_ZEPHYR_MODULES="$(pwd)/helia-rt"
      - name: Sanity check ELF + helia_rt symbols
        run: |
          set -euo pipefail
          test -f build/zephyr/zephyr.elf
          ls -lh build/zephyr/zephyr.elf
          # The Zephyr SDK toolchain binaries live under $ZEPHYR_SDK_INSTALL_DIR
          # but aren't on PATH by default in CI. Add them.
          export PATH="${ZEPHYR_SDK_INSTALL_DIR}/arm-zephyr-eabi/bin:$PATH"
          # Confirm the heliaRT TFLM runtime actually linked in (not GC'd).
          arm-zephyr-eabi-nm -C build/zephyr/zephyr.elf \
              | grep -E ' T .*(MicroPrintf|MicroAllocator|MicroInterpreter)' \
              | head -5
