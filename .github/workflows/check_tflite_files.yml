name: Check TfLite Files

on:
  workflow_call:
    inputs:
      trigger-sha:
        required: true
        type: string
      pr-number:
        required: true
        type: string
      pr-body:
        required: true
        type: string
    secrets:
      tflm-bot-token:
        required: true

# Pinned CI image, by DIGEST rather than tag: `:latest` is rebuilt by manual
# dispatch and can drift from the repo's Dockerfile with no commit recording
# it. Five workflows pin this image and they must all carry the SAME digest,
# or the test matrix and the release build run on different images. See
# .github/workflows/README.md for the pin-point list and the re-pin recipe.
env:
  CI_IMAGE: ghcr.io/ambiqai/helia-rt-ci@sha256:55372f29023cd1be1887af5761c8e6c18765b4e68ac28e02510d519e461692c9  # ghcr.io/ambiqai/helia-rt-ci:latest as of 2026-08-25

jobs:
  check_tflite_files:
    runs-on: ubuntu-latest
    name: Check PR Modifies TfLite Files
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.trigger-sha }}

      - name: Check Files
        if: ${{ !contains(inputs.pr-body, 'NO_CHECK_TFLITE_FILES=') }}
        run: |
          URL="https://api.github.com/repos/${{ github.repository }}/pulls/${{ inputs.pr-number }}/files"
          PR_FILES=$(curl -s -X GET -H "Authorization: Bearer ${{ secrets.tflm-bot-token }}" $URL | jq -r '.[] | .filename')
          rm -rf tmp_pull_request_files.txt
          echo "${PR_FILES}" >> tmp_pull_request_files.txt
          rm -rf .git
          docker run --rm -v `pwd`:/helia-rt -w /helia-rt ${{ env.CI_IMAGE }} python3 ci/check_tflite_files.py tmp_pull_request_files.txt
          TFLITE_FILE_TEST_STATUS=$?
          rm -f tmp_pull_request_files.txt
          exit ${TFLITE_FILE_TEST_STATUS}
