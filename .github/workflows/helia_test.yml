name: heliaRT Unit Tests

on:

  workflow_call:
    inputs:
      trigger-sha:
        required: true
        type: string
      # Optional ns-cmsis-nn pin override. Empty (the default) means "use the
      # pin in tensorflow/lite/micro/tools/make/ext_libs/helia.inc", which is
      # what every normal caller wants. ns_cmsis_nn_canary.yml sets it to run
      # this whole matrix against a heliaCORE release candidate.
      ns-cmsis-nn-ref:
        description: "ns-cmsis-nn commit/tag/branch to build against. Empty = repository pin."
        required: false
        type: string
        default: ""
    secrets:
      ARM_UBL_LICENSE_IDENTIFIER:
        required: false

  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA). Leave empty to use the current commit."
        required: false
        default: ""
      ns-cmsis-nn-ref:
        description: "ns-cmsis-nn commit/tag/branch to build against. Empty = repository pin."
        required: false
        default: ""

# This workflow builds a caller-supplied commit with make, so it must never
# hold more than read access. Declaring the cap here is what stops it inheriting
# a write-scoped token from a caller running under the repository's `write`
# default. Note that the container image below is a public GHCR package, so no
# `packages` grant is needed.
permissions:
  contents: read

# The CI image is resolved by the `ci-image` setup job below and consumed via
# `needs.ci-image.outputs.image`. `container.image` does not support the `env`
# context, so a tiny setup job is the cleanest way to keep a single pin point.
#
# The image is pinned by DIGEST, not by tag. `:latest` is rebuilt by manual
# dispatch of helia_build_docker_image.yml and is not a `needs:` of this
# workflow, so a tag reference lets the image drift from the repo's Dockerfile
# with no commit recording the change -- and no run records which image it
# actually used. A digest makes the image a reviewable part of the diff.
#
# Five workflows pin this image and they must all carry the SAME digest, or
# the test matrix and the release build silently run on different images.
# .github/workflows/README.md is authoritative: it lists the pin points and
# carries this same recipe. To re-pin after a rebuild, resolve the tag's
# current digest anonymously (public package, no `read:packages`, no pull):
#
#   TOKEN=$(curl -sSL \
#     "https://ghcr.io/token?scope=repository:ambiqai/helia-rt-ci:pull&service=ghcr.io" \
#     | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
#   curl -sSI -H "Authorization: Bearer ${TOKEN}" \
#     -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
#     https://ghcr.io/v2/ambiqai/helia-rt-ci/manifests/latest \
#     | grep -i docker-content-digest
#
# Both media types are offered so the multi-arch manifest still resolves if
# the image is ever republished in Docker rather than OCI format. Update every
# pin point, keeping each trailing tag comment in step.

jobs:
  ci-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - id: image
        run: echo "image=ghcr.io/ambiqai/helia-rt-ci@sha256:55372f29023cd1be1887af5761c8e6c18765b4e68ac28e02510d519e461692c9" >> "$GITHUB_OUTPUT"  # ghcr.io/ambiqai/helia-rt-ci:latest as of 2026-08-25

  helia_test:
    needs: ci-image
    runs-on: ubuntu-latest-md
    container:
      image: ${{ needs.ci-image.outputs.image }}

    strategy:
      fail-fast: false
      matrix:
        arch: [ "cortex-m55", "cortex-m4+fp", "cortex-m3" ]
        toolchain: [ "gcc", "atfe" ]
        opt: [ "SPEED", "SIZE" ]
        exclude:
          # ATfE doesn't ship a v7-M (cortex-m3) target out of the box.
          - arch: "cortex-m3"
            toolchain: "atfe"

    env:
      ARM_UBL_LICENSE_IDENTIFIER: ${{ secrets.ARM_UBL_LICENSE_IDENTIFIER }}

    name: test-${{ matrix.arch }}-${{ matrix.toolchain }}-${{ matrix.opt }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.trigger-sha }}

      - name: Mark workspace as safe for Git
        run: git config --global --add safe.directory "*"

      # Validate the ns-cmsis-nn override BEFORE anything consumes it. This
      # runs here rather than in ns_cmsis_nn_canary.yml so every caller of this
      # reusable workflow is covered, and it runs before the cache step because
      # the value is part of the cache key -- a comma or newline would corrupt
      # the key before a later check could reject it. The value also reaches
      # `git checkout` inside ext_libs/ns_cmsis_nn_download.sh, so restrict it
      # to the characters a SHA, tag, or branch name actually needs and
      # exclude anything that could start an option.
      - name: Validate ns-cmsis-nn ref
        if: ${{ inputs.ns-cmsis-nn-ref != '' }}
        env:
          NS_CMSIS_NN_REF: ${{ inputs.ns-cmsis-nn-ref }}
        run: |
          case "${NS_CMSIS_NN_REF}" in
            -*) echo "::error ::ns-cmsis-nn-ref must not begin with '-'"; exit 1 ;;
          esac
          if ! printf '%s' "${NS_CMSIS_NN_REF}" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::error ::ns-cmsis-nn-ref must match ^[A-Za-z0-9._/-]+$"
            exit 1
          fi
          echo "ns-cmsis-nn ref accepted: ${NS_CMSIS_NN_REF}"

      - name: Cache third-party downloads
        uses: actions/cache@v6
        with:
          path: tensorflow/lite/micro/tools/make/downloads
          # The ns-cmsis-nn override is part of the key: the hashed files are
          # identical under an override, so without this a canary run would
          # restore (and then re-save) the pinned clone under the same key and
          # churn the cache the normal matrix depends on.
          key: ${{ runner.os }}-third-party-downloads-${{ hashFiles('tensorflow/lite/micro/tools/make/Makefile','tensorflow/lite/micro/tools/make/third_party_downloads.inc','tensorflow/lite/micro/tools/make/*_download.sh','tensorflow/lite/micro/tools/make/ext_libs/*_download.sh','tensorflow/lite/micro/tools/make/ext_libs/helia.inc') }}${{ inputs.ns-cmsis-nn-ref && format('-nscnn-{0}', inputs.ns-cmsis-nn-ref) || '' }}

      # ccache is baked into the CI image (.devcontainer/Dockerfile), but
      # keep an apt-get fallback so this workflow still works when the pinned
      # digest predates that change (e.g. mid-rollout, since the image build
      # job is not a `needs:` dependency of this workflow).
      - name: Ensure ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends ccache
          fi
          # Capture, then trim. This step does not set `pipefail` today, so
          # `ccache --version | head -1` is currently harmless -- but adding
          # `set -o pipefail` later would quietly arm it. Heredoc rather than
          # a `<<<` herestring: nothing else in this workflow requires bash,
          # and it runs in a container where the shell is whatever the image
          # provides.
          ccache_version=$(ccache --version)
          head -1 <<EOF
          ${ccache_version}
          EOF

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          # Save key uses run_id so each run produces a fresh save.
          # restore-keys does prefix-fallback so we always inherit the most
          # recent prior cache for this toolchain+arch slot. Safe with
          # ccache: it hashes preprocessed content + compiler mtime/size,
          # so stale hits are not possible (unlike third-party-downloads).
          key: ${{ runner.os }}-ccache-${{ matrix.toolchain }}-${{ matrix.arch }}-${{ matrix.opt }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.toolchain }}-${{ matrix.arch }}-${{ matrix.opt }}-
            ${{ runner.os }}-ccache-${{ matrix.toolchain }}-${{ matrix.arch }}-

      - name: Testing (${{ matrix.arch }} / ${{ matrix.toolchain }} / ${{ matrix.opt }})
        env:
          CCACHE_WRAP_DIR: ${{ runner.temp }}/ccwrap
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPRESS: "true"
          CCACHE_COMPRESSLEVEL: "6"
          CCACHE_MAXSIZE: "2G"
          NS_CMSIS_NN_REF: ${{ inputs.ns-cmsis-nn-ref }}
        run: |
          # Configure & zero stats before the build so the post-build
          # 'ccache -s' line shows only this run.
          ccache -o max_size=${CCACHE_MAXSIZE} || true
          ccache -z || true
          # Only export NS_CMSIS_NN_COMMIT when an override was requested.
          # ext_libs/helia.inc sets it with `?=`, and make treats an
          # environment variable defined as the empty string as *defined* --
          # so exporting an empty value would suppress the repository pin
          # rather than fall back to it.
          if [ -n "${NS_CMSIS_NN_REF}" ]; then
            echo "==> ns-cmsis-nn pin OVERRIDDEN to ${NS_CMSIS_NN_REF}"
            export NS_CMSIS_NN_COMMIT="${NS_CMSIS_NN_REF}"
          fi
          /bin/sh -c "tensorflow/lite/micro/tools/ci_build/test_helia.sh \
          -a ${{ matrix.arch }} -t ${{ matrix.toolchain }} -O ${{ matrix.opt }}"

      - name: Show ccache stats
        if: always()
        run: ccache -s || true
