# tests_entry.yml
# Entry point to the test suites
#
# - If ci:run_full label is on PR, run the ci workflow as well.
#
# This script runs the test scripts directly. Scheduled or manual runs use
# run_<scriptname>.yml as the entry point.

name: Tests Entry Point

# Trigger note: this MUST stay `pull_request`, not `pull_request_target`.
#
# Everything reachable from here checks out the pull request head commit and
# builds it with make (see helia_test.yml / ci.yml). Under
# `pull_request_target` that untrusted build would run in the context of the
# base repository, i.e. with a GITHUB_TOKEN carrying the repository's default
# workflow permissions (currently `write`), which hands any fork contributor
# who edits a Makefile or a ci_build script a write-scoped token for this
# repository. Under `pull_request` a fork's run gets a read-only token and no
# access to repository secrets, which is the correct model for a path that
# only builds and tests.
#
# This path needs neither: the PR matrix is gcc/atfe only, no secrets are
# passed to the called workflows, and nothing here writes to the repository.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - labeled

# Least privilege. Checkout is the only thing on this path that needs the
# token at all, and it only needs to read. This also propagates to the called
# reusable workflows, which can reduce it further but never widen it.
permissions:
  contents: read

# Cancel an in-flight run for this PR when a newer commit is pushed.
# Keyed on the PR number (or branch ref for non-PR triggers) so each PR
# has its own concurrency lane and unrelated PRs don't block each other.
# Saves ~25min x 10 matrix jobs every fixup push.
concurrency:
  group: tests-entry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # Do not rename this job id. GitHub names the resulting check runs
  # "<caller job id> / <called job name>", so this id is the literal
  # "helia-test / ..." prefix of the ten required status check contexts in the
  # `main` branch ruleset. Renaming it makes `main` unmergeable until the
  # ruleset is updated to match.
  helia-test:
    # `labeled` is in this workflow's trigger list so that adding `ci:run_full`
    # can start the ci-run job below. Without this guard the ten-job matrix also
    # restarts for every *other* label, which costs a full CI pass and buys
    # nothing:
    #
    #   - release-please labels a merged release PR `autorelease: tagged` after
    #     cutting a release, which would re-run the whole matrix against a
    #     commit that is already on `main`.
    #   - it labels a freshly opened release PR `autorelease: pending` moments
    #     after `opened`, so the label run would cancel the opened run (see the
    #     concurrency group above) and the required contexts would briefly read
    #     "cancelled" — easy to misread as a failure.
    #
    # Skipping here is safe for the required status checks: a label event does
    # not change the head SHA, so the contexts already reported for that SHA by
    # the opened/synchronize run stay the latest result for their names.
    if: >-
      github.event.action != 'labeled' ||
      github.event.label.name == 'ci:run_full'
    uses: ./.github/workflows/helia_test.yml
    with:
      trigger-sha: ${{ github.event.pull_request.head.sha }}

  ci-run:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'ci:run_full') }}
    uses: ./.github/workflows/ci.yml
    with:
      trigger-sha: ${{ github.event.pull_request.head.sha }}
